    <div class="container">
        <section class="thought-pieces">
            <article class="thought-article">
                <h1 class="article-title" id="article-title">Loading...</h1>
                <p class="article-meta">
                    <span class="article-date" id="article-date"></span>
                </p>

                <div class="article-content" id="article-content">
                    <p>Loading content...</p>
                </div>

                <div class="back-link" style="margin-top: 2rem;">

    <script src="../script.js"></script>
    <script>
        // Get the filename and date from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const filename = urlParams.get('file');
        const date = urlParams.get('date');

        if (!filename) {
            document.getElementById('article-title').textContent = 'No file specified';
            document.getElementById('article-content').innerHTML = '<p>Please select a piece to read.</p>';
        } else {
            // Remove .txt extension for display title
            const title = filename.replace('.txt', '');
            document.getElementById('article-title').textContent = title;
            document.getElementById('page-title').textContent = title + ' - Tharan Suresh';

            // Display the publication date if provided
            if (date) {
                document.getElementById('article-date').textContent = date;
            }

            // Fetch and display the text file
            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('File not found');
                    }
                    return response.text();
                })
                .then(text => {
                    // Convert text to HTML paragraphs
                    const paragraphs = text.split('\n\n').map(para => {
                        para = para.trim();
                        if (para) {
                            // Preserve line breaks within paragraphs
                            para = para.replace(/\n/g, '<br>');
                            return '<p>' + para + '</p>';
                        }
                        return '';
                    }).join('');

                    document.getElementById('article-content').innerHTML = paragraphs;
                })
                .catch(error => {
                    document.getElementById('article-content').innerHTML = '<p>Error loading content: ' + error.message + '</p>';
                });
        }
    </script>
</body>
</html>
