    <div class="lightbox" id="lightbox" hidden>
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <img src="" alt="">
        <p class="lightbox-caption"></p>
    </div>

    <script src="script.js"></script>
    <script>
        (function () {
            var box = document.getElementById('lightbox');
            var big = box.querySelector('img');
            var cap = box.querySelector('.lightbox-caption');
            function close() { box.hidden = true; big.src = ''; document.body.style.overflow = ''; }
            document.querySelectorAll('.gallery-item a.thumb').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    big.src = a.getAttribute('href');
                    big.alt = a.querySelector('img').alt;
                    cap.textContent = a.parentElement.querySelector('figcaption').textContent;
                    box.hidden = false;
                    document.body.style.overflow = 'hidden';
                });
            });
            box.addEventListener('click', close);
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
        })();
    </script>
